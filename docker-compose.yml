services:
  onyx:
    build: .
    container_name: onyx
    ports:
      - "${ONYX_PORT:-8080}:8080"
    volumes:
      - ./config:/config
      - ./data:/srv
      - ./.versions:/.versions
      - ./.trash:/.trash
      - ./.cache:/.cache
    environment:
      - ONYX_DATA=/srv
      - ONYX_CONFIG=/config
      # Run as this UID:GID (default 1000:1000). The entrypoint ensures
      # all mounted directories are owned by this user before starting.
      # - PUID=1000
      # - PGID=1000
      # Hardware-accelerated video transcoding. Values: auto (default —
      # probes NVENC / QSV / VAAPI / AMF in that order), nvenc, qsv,
      # vaapi, amf, or none (force libx264). Unavailable forced encoders
      # fall back to software with a WARN log.
      # - ONYX_HWACCEL=auto
      # Caps the highest ABR rung produced per transcode. Values: 480,
      # 720, 1080, 1440, 2160. Defaults to 2160.
      # - ONYX_MAX_TRANSCODE_HEIGHT=2160
      # Enable built-in HTTPS. Auto-generates a self-signed cert
      # in /config on first run. Set to true and restart.
      # - ONYX_HTTPS=true
      # Optional: use your own cert/key instead of auto-generated.
      # - ONYX_TLS_CERT=/config/custom.crt
      # - ONYX_TLS_KEY=/config/custom.key
      # Trust reverse proxy headers (X-Forwarded-Proto, X-Real-IP).
      # Required when running behind nginx, Caddy, Traefik, etc.
      # - ONYX_TRUSTED_PROXY=true
      # Canonical domain — redirects requests with a different Host
      # header (e.g. IP address) to this hostname via 301.
      # - ONYX_DOMAIN=onyx.example.com
      # Separate HTTP→HTTPS redirect listener. Requires ONYX_HTTPS=true.
      # Map the redirect port in `ports:` (e.g. "80:80").
      # - ONYX_HTTPS_REDIRECT=true
      # - ONYX_HTTPS_REDIRECT_PORT=80
    restart: unless-stopped
    # --- GPU passthrough (uncomment the block matching your hardware) ---
    #
    # NVIDIA (NVENC) — requires nvidia-container-toolkit on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]
    #
    # Intel QSV or AMD VAAPI/AMF — pass the DRM render node through:
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - "989"   # host 'render' group gid; check with `getent group render`
    #
